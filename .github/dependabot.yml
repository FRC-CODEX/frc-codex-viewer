version: 2
updates:
  - package-ecosystem: "docker"
    cooldown:
      default-days: 1
    directories:
      - /**
    schedule:
      interval: "weekly"
    groups:
      docker-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 1
    directories:
      - /**
    schedule:
      interval: weekly
    groups:
      gha-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: "gradle"
    cooldown:
      default-days: 1
    directories:
      - /**
    schedule:
      interval: "weekly"
    groups:
      gradle-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: "npm"
    cooldown:
      default-days: 1
    directories:
      - /**
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "ixbrl-viewer"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "puppeteer-core"
        versions:
          - ">=25"
      - dependency-name: "puppeteer-screen-recorder"
        versions:
          - "3.0.5"
          - "3.0.6"
  - package-ecosystem: pip
    cooldown:
      default-days: 1
    directories:
      - /**
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "ixbrl-viewer"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
